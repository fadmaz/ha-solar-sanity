rescore_forecasts:
  # No fields. It scores every configured provider on every installation,
  # because a service that made you name one would be asking you to know
  # an entry id.
get_setup_check:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: solar_sanity
get_forecast_history:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: solar_sanity
    days:
      default: 28
      selector:
        number:
          min: 1
          max: 90
          mode: box
preview_battery_settings:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: solar_sanity
    projection_id:
      required: true
      selector:
        text:
    battery_charge_power_limit_w:
      selector:
        number:
          step: any
          mode: box
          unit_of_measurement: W
    inverter_standby_w:
      selector:
        number:
          min: 0
          step: any
          mode: box
          unit_of_measurement: W
simulate_load:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: solar_sanity
    power_w:
      required: true
      default: 1000
      selector:
        number:
          min: 0
          mode: box
          unit_of_measurement: W
    duration_minutes:
      required: true
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          mode: box
          unit_of_measurement: min
    start_at:
      selector:
        text:
find_best_time:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: solar_sanity
    power_w:
      required: true
      default: 1000
      selector:
        number:
          min: 0
          mode: box
          unit_of_measurement: W
    duration_minutes:
      required: true
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          mode: box
          unit_of_measurement: min
    earliest_start:
      selector:
        text:
    finish_by:
      required: true
      selector:
        text:
