rescore_forecasts:
  # No fields. It scores every configured provider on every installation,
  # because a service that made you name one would be asking you to know
  # an entry id.
get_setup_check:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: solar_sanity
get_forecast_history:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: solar_sanity
    days:
      default: 28
      selector:
        number:
          min: 1
          max: 90
          mode: box
simulate_load:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: solar_sanity
    power_w:
      required: true
      default: 1000
      selector:
        number:
          min: 0
          mode: box
          unit_of_measurement: W
    duration_minutes:
      required: true
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          mode: box
          unit_of_measurement: min
    start_at:
      selector:
        text:
