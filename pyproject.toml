[project]
name = "solar-sanity"
version = "0.1.0"
description = "Tells you whether your solar data adds up."
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
# `asyncio_mode` is deliberately NOT set. pytest-asyncio is installed, via
# pytest-homeassistant-custom-component, but that package manages the event loop
# itself — setting "auto" hands the same job to two owners and 23 tests error
# with "There is no current event loop in thread 'MainThread'". Tried on
# 2026-08-28; the CI run is on PR #51 if anyone wants the evidence.
#
# So write `async def` tests only where HA's own fixtures drive them. A helper
# that merely happens to be a coroutine is better driven with `asyncio.run`.
testpaths = ["tests"]
# `analysis` is imported absolutely so the package can load with Home Assistant
# absent. That is a structural purity guarantee, not a convention.
pythonpath = [".", "custom_components/solar_sanity"]
filterwarnings = ["error::DeprecationWarning:solar_sanity.*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "C4", "PIE", "RET"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "RUF012",
    # Guard clauses read better with the literal in them than with a constant
    # named after a number.
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLC0415"]
# Home Assistant integrations import recorder and energy internals lazily,
# because those components may not be loaded at all.
"custom_components/solar_sanity/*.py" = ["PLC0415"]
