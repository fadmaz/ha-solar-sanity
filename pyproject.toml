[project]
name = "solar-sanity"
version = "0.1.0"
description = "Tells you whether your solar data adds up."
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
# `asyncio_mode` is "auto" because the Home Assistant fixtures cannot work
# without it. `pytest-homeassistant-custom-component` declares `hass` — and
# roughly twenty others — as a plain `@pytest.fixture` on an `async def`
# generator, and pytest-asyncio's strict mode ignores an async fixture carrying
# no explicit mark. Ignores, not fails: the fixture simply never runs, and every
# test asking for it errors at setup complaining about something else. Marking
# the test by hand does not rescue it, because the fixture is what is unmarked.
#
# Measured on the pair CI actually installs, which `requirements-dev.txt` does
# not choose — its floors are all unbounded and
# `pytest-homeassistant-custom-component` hard-pins `pytest==9.0.0` and
# `pytest-asyncio==1.3.0` underneath them. On that pair, a fixture shaped like
# `hass` gives 2 passed and 2 setup errors under strict, and 4 passed under
# auto.
#
# It changes nothing else. Auto mode only marks nodes it can substitute —
# coroutine functions, async generators, and the async-hypothesis case — and
# this suite has none outside `tests/integration`. Collection is identical
# either way, which was checked rather than assumed.
#
# `_drive` in tests/test_entity_honesty.py stays exactly as it is. It sends
# `None` into a coroutine that never suspends, which bypasses the plugin
# entirely, and its docstring records why `asyncio.run` is the wrong tool there
# — it closes the loop out from under every test that follows. That reasoning is
# untouched by this setting, and the three sweep tests it carries do not need a
# loop at all.
#
# One cosmetic consequence: where pytest-asyncio is absent — every machine
# without Home Assistant, which is most of them — pytest prints
# `Unknown config option: asyncio_mode`. Collection and results are unaffected,
# and nothing here passes `--strict-config`.
asyncio_mode = "auto"
# Unset, pytest-asyncio warns on every run. The documented fallback is the
# fixture caching scope rather than function scope, which is not what any
# Home Assistant fixture wants.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# The clean corpus is 3,000 healthy installations and takes about three minutes
# serially. Running it on every push would make the suite slow enough to start
# being skipped, and a gate nobody waits for is not a gate. Every pull request
# runs a 600-scenario stratified subset that still covers every axis
# combination; the full corpus runs on main and on the Monday schedule.
#
# Deselected by default rather than opt-in, so `pytest tests` stays fast for
# anyone working in the repository.
addopts = "-m 'not slow'"
markers = ["slow: the full clean corpus; runs on main and the weekly schedule"]
# `analysis` is imported absolutely so the package can load with Home Assistant
# absent. That is a structural purity guarantee, not a convention.
pythonpath = [".", "custom_components/solar_sanity"]
filterwarnings = ["error::DeprecationWarning:solar_sanity.*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "C4", "PIE", "RET"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "RUF012",
    # Guard clauses read better with the literal in them than with a constant
    # named after a number.
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLC0415"]
# Home Assistant integrations import recorder and energy internals lazily,
# because those components may not be loaded at all.
"custom_components/solar_sanity/*.py" = ["PLC0415"]
