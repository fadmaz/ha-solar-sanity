name: Validate

on:
  push:
  pull_request:
  schedule:
    # Upstream breaks things on their own schedule, not ours.
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Run the suite
        run: python -m pytest tests -q

  tests-floor:
    name: Tests (declared floor)
    # The version hacs.json declares, which until now was never executed once:
    # requirements-dev.txt pins the newest harness that resolves on 3.13, which
    # is Home Assistant 2026.2.3, so the floor was a number in a file and
    # nothing else. It was 2025.1.0 and the integration could not start there.
    #
    # 0.13.294 hard-pins homeassistant==2025.11.0, with pytest 8.4.2 and
    # pytest-asyncio 1.2.0 under it, so it is installed alone rather than on top
    # of requirements-dev.txt, which would install a newer set and then
    # downgrade three of them.
    #
    # Move this pin whenever hacs.json's floor moves; the collection guard reads
    # that file, so the two cannot silently disagree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "pytest-homeassistant-custom-component==0.13.294"
      - name: The suite, at the minimum this repository promises
        run: python -m pytest tests -q

  corpus:
    name: Clean corpus
    # The full 3,000-scenario healthy-house corpus. Not on pull requests: they
    # run the 600-scenario subset inside the ordinary suite, which covers every
    # axis combination at fewer seeds. This is the one that would catch a false
    # accusation that only one seed in ten produces.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Every healthy house, silent
        # No coverage on this job: it makes the engine about thirteen times
        # slower, which turns three minutes into forty.
        run: python -m pytest tests -q -m slow -n auto

      - name: No websocket commands without the dependency to serve them
        run: |
          # `websocket_api` was declared for years and never called. It is gone
          # from the manifest; registering a command without putting it back
          # would fail at runtime for every user, and only for users, because
          # nothing in the test suite sets up the websocket component.
          if grep -rn "async_register_command" custom_components/ --include=*.py; then
            echo "::error::async_register_command needs websocket_api in manifest dependencies"
            exit 1
          fi
          echo "no websocket commands registered"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  deprecations:
    name: Upstream deadlines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: External statistics must set mean_type and unit_class
        run: |
          # Omitting either is deprecated now and a hard error in Home
          # Assistant 2026.11. Custom integrations are not exempt.
          if grep -rn "async_add_external_statistics" custom_components/ --include=*.py \
             | grep -v "^.*statistics_source.py" ; then
            echo "external statistics written outside statistics_source.py"; exit 1
          fi
          grep -q "mean_type=StatisticMeanType.NONE" custom_components/solar_sanity/statistics_source.py \
            || { echo "missing mean_type"; exit 1; }
          grep -q 'unit_class="energy"' custom_components/solar_sanity/statistics_source.py \
            || { echo "missing unit_class"; exit 1; }
          echo "statistics metadata is 2026.11-safe"

      - name: No config entry update listeners
        run: |
          # Combining these with async_update_reload_and_abort or
          # OptionsFlowWithReload is an error from Home Assistant 2026.12.
          if grep -rn "add_update_listener" custom_components/ --include=*.py; then
            echo "update listener found; use the listener-free path"; exit 1
          fi
          echo "no update listeners"

  card:
    name: Card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Card tests
        run: npm test
      - name: Bundle size budget
        run: python scripts/check_size.py
